[project]
name = "workplace-domain"
version = "0.1.0"
description = "Shared domain models, config schema, enums and adapter interfaces"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "tzdata>=2025.1",  # IANA timezones on Windows, where the OS provides none
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "workplace_domain"
module-root = ""
