:root { box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html { scroll-padding-top:env(safe-area-inset-top,0px); }
*, *::before, *::after { box-sizing:inherit; }
body { margin:0; background:var(--page); color:var(--ink); font:14px/1.5 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-variant-numeric:tabular-nums; }
button { font:inherit; color:inherit; background:var(--panel); border:1px solid var(--rule); border-radius:6px; padding:6px 12px; cursor:pointer; }
button:hover { border-color:var(--ink-3); }
button:focus-visible, [tabindex]:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
.seg { display:inline-flex; border:1px solid var(--rule); border-radius:7px; overflow:hidden; background:var(--panel); }
.seg button { border:0; border-radius:0; padding:6px 12px; }
.seg button + button { border-left:1px solid var(--rule); }
.seg button[aria-pressed="true"] { background:var(--ink); color:var(--paper); }
header { display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--rule); }
.brand b { font-weight:600; font-size:15px; display:block; } .brand span { color:var(--ink-2); font-size:12px; }
.clock { font-size:20px; font-weight:500; margin-left:6px; }
.live { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--esg); }
.live i { width:7px; height:7px; border-radius:50%; background:var(--esg); }
.grow { flex:1; }
main { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:16px; padding:16px 20px 24px; max-width:1560px; margin:0 auto; }

.sheet { background:var(--panel); border:1px solid var(--rule); border-radius:10px; }
.plan-head { display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:14px 18px 10px; }
.plan-head h1 { font-size:18px; font-weight:600; margin:0; }
.plan-head .meta { color:var(--ink-2); font-size:13px; }
.plan-head .seg { margin-left:auto; }
.opstrip { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); }
.opstrip div { padding:10px 18px; border-right:1px solid var(--rule); }
.opstrip div:last-child { border-right:0; }
.opstrip b { display:block; font-size:22px; font-weight:500; } .opstrip span { font-size:12px; color:var(--ink-2); }
.opstrip .truth { background:repeating-linear-gradient(135deg, transparent 0 6px, var(--page) 6px 7px); }
.plan-wrap { padding:14px 14px 4px; overflow-x:auto; }
svg.plan { display:block; width:100%; min-width:760px; height:auto; }
.legend { display:flex; flex-wrap:wrap; gap:6px 18px; padding:6px 18px 16px; font-size:12px; color:var(--ink-2); }
.legend span { display:inline-flex; align-items:center; gap:6px; }
.sw { width:14px; height:10px; border-radius:2px; border:1px solid; display:inline-block; }
aside { display:flex; flex-direction:column; gap:16px; }
aside section { padding:14px 16px; }
aside h2 { font-size:14px; font-weight:600; margin:0 0 10px; }
.detail dl { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:0; font-size:13px; }
.detail dt { color:var(--ink-2); } .detail dd { margin:0; }
.hint { color:var(--ink-3); font-size:13px; margin:0; }
.spark { margin:10px 0 2px; } .spark small { color:var(--ink-3); font-size:11px; }
.up { color:var(--warm); } .down { color:var(--cool); }
.esg-grid { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--rule); border:1px solid var(--rule); border-radius:8px; overflow:hidden; }
.esg-grid div { background:var(--panel); padding:10px 12px; }
.esg-grid b { display:block; font-size:19px; font-weight:500; } .esg-grid span { font-size:12px; color:var(--ink-2); }
.esg-grid .hero { grid-column:1 / -1; background:var(--esg-bg); } .esg-grid .hero b { color:var(--esg); font-size:26px; }
.log { list-style:none; margin:0; padding:0; font-size:13px; }
.log li { display:grid; grid-template-columns:40px 1fr; gap:8px; padding:8px 0; border-top:1px solid var(--rule); }
.log li:first-child { border-top:0; padding-top:0; }
.log time { color:var(--ink-3); } .log small { display:block; color:var(--ink-2); }
.tag { display:inline-block; font-size:11px; font-weight:500; padding:1px 7px; border-radius:10px; margin-right:6px; }

    el("rect", { x:d.x+.07, y:d.y+.05, width:1.36, height:.65, rx:.1, fill:f, stroke:s, "stroke-width":.06 }, g);
    if (d.state === "held" && S.layer === "occ") el("circle", { cx:d.x+.75, cy:d.y+.375, r:.13, fill:"var(--panel)" }, g);
    if (S.sel === d) el("rect", { x:d.x-.1, y:d.y-.1, width:1.7, height:.95, rx:.18, fill:"none", stroke:"var(--focus)", "stroke-width":.12 }, g);
  });
}
/* temperature colour: cool blue → comfort neutral → warm orange → hot red */
function tempColor(t) { const st = [[21,"#3B7DD8"],[22.5,"#C9DBF3"],[24.5,"#EEF1F5"],[26,"#F0903A"],[27.5,"#D23B2A"]];
  let a = st[0], b = st[4]; for (let i = 0; i < 4; i++) if (t >= st[i][0] && t <= st[i+1][0]) { a = st[i]; b = st[i+1]; }
  const k = Math.max(0, Math.min(1, (t - a[0]) / (b[0] - a[0]))); return `color-mix(in srgb, ${b[1]} ${Math.round(k*100)}%, ${a[1]})`; }
function arrow(dt) { return Math.abs(dt) < .2 ? ["→", "var(--ink-3)"] : dt > 0 ? [`▲${f1(dt)}`, "var(--warm)"] : [`▼${f1(-dt)}`, "var(--cool)"]; }
const HV = { ECO:["Eco","#1F9D7A"], HIGH:["High","#E07A1F"], BOOST:["Vent boost","#E07A1F"], PRECOOL:["Pre-cool","#3B7DD8"] };
function overlay() {
  const G = L.overlay; G.innerHTML = ""; L.labels.querySelectorAll(".ov").forEach(n => n.remove());
  AREAS.forEach(a => {
    const isRoom = a.kind === "room", small = a.cap === 1, [arr, ac] = arrow(trend(a));
    const put = (txt, col, top = false) => { const t = el("text", { class:"ov", x:a.x + a.w - .4, y: isRoom && !top ? a.y + a.h - .45 : a.y + 1.05, "text-anchor":"end",
      "font-size": small ? .5 : .6, "font-weight":500, fill:col, "pointer-events":"none" }, L.labels); t.textContent = txt; };
    if (S.layer === "occ") {                     /* only exceptions on the default layer: hot and warming */
      if (a.temp >= 25.5 && people(a) > 0) put(isRoom && a.w < 5.5 ? `${f1(a.temp)}°▲` : `${f1(a.temp)}° ${arr}`, "var(--warm)", true); return; }
    let fill = null;
    if (S.layer === "temp") { fill = `color-mix(in srgb, ${tempColor(a.temp)} 70%, transparent)`; put(small ? `${f1(a.temp)}°` : `${f1(a.temp)}°  ${arr}`, small ? "var(--ink)" : ac === "var(--ink-3)" ? "var(--ink)" : ac); }
    if (S.layer === "light") { const lv = a.light; fill = lv >= 100 ? "rgba(250,204,21,.28)" : lv >= 70 ? "rgba(250,204,21,.15)" : lv > 0 ? "rgba(100,116,139,.15)" : "rgba(51,65,85,.26)";
      put(lv ? `${lv}%` : "Off", "var(--ink)"); }
    if (S.layer === "hvac" && HV[a.mode]) { fill = `color-mix(in srgb, ${HV[a.mode][1]} 20%, transparent)`; put(HV[a.mode][0], "var(--ink)"); }
    if (fill) el("rect", { x:a.x+.08, y:a.y+.08, width:a.w-.16, height:a.h-.16, fill, "pointer-events":"none" }, G);
  });
}
const dotNodes = {};
function dots() {
  const G = L.dots; G.style.display = S.view === "sim" ? "" : "none"; if (S.view !== "sim") return;
  const seen = new Set(), add = (key, x, y, c) => { seen.add(key); let n = dotNodes[key];
    if (!n || !n.isConnected) { n = el("circle", { class:"dot", r:.3, fill:c, stroke:"var(--paper)", "stroke-width":.09 }, G); n.style.transition = "transform .9s cubic-bezier(.4,0,.2,1)"; dotNodes[key] = n; }
    n.style.transform = `translate(${x}px, ${y}px)`; };
  DESKS.forEach(d => d.state === "occ" && add("d" + d.workspace_id, d.x + .75, d.facing === "N" ? d.y - .35 : d.y + 1.1, DEPTS[d.dept]));
  AREAS.filter(a => a.count).forEach(a => { for (let i = 0; i < a.count; i++) { const t = i / a.count * Math.PI * 2;
    add("a" + a.id + i, a.x + a.w/2 + Math.min(a.w*.3, 2.4)*Math.cos(t), a.y + a.h/2 + .45 + Math.min(a.h*.22, 1.2)*Math.sin(t), Object.values(DEPTS)[(i*3 + a.name.length) % 7]); } });
  for (const k in dotNodes) if (!seen.has(k)) { dotNodes[k].remove(); delete dotNodes[k]; }
}

/* ---------- panels ---------- */
function ops() {
  const occ = DESKS.filter(d => d.state === "occ").length, held = DESKS.filter(d => d.state === "held").length;
  const inUse = AREAS.filter(a => a.kind === "room" && a.cap > 1 && a.count > 0).length, inRooms = AREAS.filter(a => a.count).reduce((s, a) => s + a.count, 0);
  const hot = AREAS.filter(a => a.temp >= 25.5 && people(a) > 0).length;
  const cells = [[`${Math.round(100*occ/DESKS.length)}%`,"Desk utilisation"],[`${occ} · ${held}`,"Desks occupied · held"],[`${inUse}/8`,"Meeting rooms in use"],
    [occ + inRooms,"Estimated people"],[hot,"Warm spots (≥ 25.5 °C)"]];
  if (S.view === "sim") cells.push([occ + inRooms + 6, "True headcount", true]);
  document.getElementById("ops").innerHTML = cells.map(([v,l,t]) => `<div class="${t ? "truth" : ""}"><b>${v}</b><span>${l}</span></div>`).join("");
}
function legend() {
  const sw = (bg, bd, x = "") => `<i class="sw" style="background:${bg};border-color:${bd};${x}"></i>`;
  const sets = {
    occ:[[sw("var(--desk-occ)","var(--desk-occ-line)"),"Occupied"],[sw("var(--desk-held)","var(--desk-held-line)"),"Held, away"],[sw("var(--desk-vacant)","var(--desk-vacant-line)"),"Available"],
      [sw("color-mix(in srgb, var(--accent) 32%, var(--paper))","var(--room-line)"),"Room in use"],[`<b style="color:var(--warm);font-weight:500">25.9° ▲</b>`,"Warm and rising"]],
    temp:[[sw("#3B7DD8","#3B7DD8"),"21°"],[sw("#EEF1F5","#B4BDC8"),"22.5–24.5° comfort"],[sw("#F0903A","#F0903A"),"26°"],[sw("#D23B2A","#D23B2A"),"27.5°"],
      [`<b style="color:var(--warm);font-weight:500">▲</b><b style="color:var(--cool);font-weight:500">▼</b>`,"Change in last 15 min"]],
    light:[[sw("rgba(250,204,21,.4)","#C9A10A"),"Full"],[sw("rgba(250,204,21,.2)","#C9A10A"),"Daylight dimmed"],[sw("rgba(100,116,139,.2)","#8E98A5"),"Dimmed, empty"],[sw("rgba(51,65,85,.32)","#5A6674"),"Off"]],
    hvac:[[sw("color-mix(in srgb,#1F9D7A 28%,transparent)","#1F9D7A"),"Eco"],[sw("color-mix(in srgb,#3B7DD8 28%,transparent)","#3B7DD8"),"Pre-cool"],[sw("color-mix(in srgb,#E07A1F 28%,transparent)","#E07A1F"),"High / vent boost"]] };
  let html = sets[S.layer].map(([s,l]) => `<span>${s}${l}</span>`).join("");
  if (S.view === "sim") html += Object.entries(DEPTS).map(([d,c]) => `<span><i class="sw" style="background:${c};border-color:${c};border-radius:50%;width:10px"></i>${d}</span>`).join("");
  document.getElementById("legend").innerHTML = html;
  document.getElementById("note").textContent = S.view === "sim" ? "Dots are ground truth from the simulation. Figures above stay sensor- and badge-based; the striped cell is truth."
    : "Shows only what building systems report: desk sensors, logins, room counters, badge readers and zone sensors.";
}
function spark(a) {
  const W = 280, H = 64, vals = [...a.hist, a.setpoint], lo = Math.min(...vals) - .3, hi = Math.max(...vals) + .3;
  const X = i => i / (a.hist.length - 1) * (W - 8) + 4, Y = v => H - 6 - (v - lo) / (hi - lo) * (H - 14);
  const path = a.hist.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("");
  return `<div class="spark"><svg width="100%" viewBox="0 0 ${W} ${H}" role="img" aria-label="Temperature over the last hour">
    <line x1="4" x2="${W-4}" y1="${Y(a.setpoint)}" y2="${Y(a.setpoint)}" stroke="var(--ink-3)" stroke-dasharray="4 3" stroke-width="1"/>
    <path d="${path}" fill="none" stroke="var(--warm)" stroke-width="2"/><circle cx="${X(a.hist.length-1)}" cy="${Y(a.temp)}" r="3" fill="var(--warm)"/></svg>
    <small>Last hour · dashed line = setpoint ${f1(a.setpoint)} °C</small></div>`;
}
function select(o) {
  S.sel = o; rooms(); desks(); const box = document.getElementById("detail"); let rows, extra = "";
  if (o.workspace_id) {
    rows = [["Desk", o.workspace_id.replace("DESK_BLD01_F02_","")], ["Area", AREAS.find(a => a.code === o.zone_code).name],
      ["Sensor", o.state === "occ" ? `Occupied since ${o.since}` : o.state === "off" ? "Offline" : "Vacant"],
      ["Workstation", o.state === "occ" || o.state === "held" ? `${o.emp} logged in` : "No login"]];
  } else {
    const [arr] = arrow(trend(o)), n = people(o);
    const why = o.kind === "room" ? { released:"Booking auto-released, lights off, eco", over:"Ventilation boosted", oversized:"Right-size suggestion", booked:"Pre-cooling for 11:00", free:"Lights off, eco" }[o.status] : null;
    rows = [[o.kind === "room" ? "Room" : "Area", o.name], ["People", `${n} of ${o.cap}`], ["Temperature", `${f1(o.temp)} °C <span class="${arr.startsWith("▲") ? "up" : arr.startsWith("▼") ? "down" : ""}">${arr}</span>`],
      ["CO₂", `${Math.round(o.co2)} ppm`], ["HVAC", (HV[o.mode] || ["Normal"])[0]], ["Lighting", o.light ? `${o.light}%` : "Off"]];
    if (why) rows.push(["Automation", why]);
    extra = spark(o);
  }
  box.innerHTML = `<h2>Selection</h2><dl>${rows.map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>${extra}`;
}
const LOG = [
  ["10:41","room","Workshop booking released","No one arrived 10 min after start."],
  ["10:38","hvac","Noyyal ventilation boosted","5 people in a 4-seat room, CO₂ 1,180 ppm."],
  ["10:35","hvac","Amaravathi pre-cooling","Booked for 11:00, 7 attendees."],
  ["10:05","light","Team hub dimmed to 30%","Empty for 15 min."],
];
function log() { const tag = { hvac:["HVAC","t-hvac"], light:["Lighting","t-light"], room:["Rooms","t-room"] };
  document.getElementById("log").innerHTML = LOG.slice(0, 4).map(([t,k,a,b]) => `<li><time>${t}</time><div><span class="tag ${tag[k][1]}">${tag[k][0]}</span>${a}<small>${b}</small></div></li>`).join(""); }

/* ---------- crowd-driven environment + automation (demo of the algorithm) ---------- */
let minute = 42;
function step() {
  minute += 5;
  const hhmm = `${10 + Math.floor(minute/60)}:${String(minute % 60).padStart(2, "0")}`;
  for (let i = 0; i < 5; i++) { const d = DESKS[Math.floor(rnd()*DESKS.length)]; if (d.state === "off") continue;
    d.state = d.state === "occ" ? (rnd() < .5 ? "held" : "vacant") : d.state === "held" ? "occ" : (rnd() < .55 ? "occ" : "vacant"); }
  AREAS.forEach(a => {
    if (a.kind === "room" && a.status === "in_use" && a.cap > 1) a.count = Math.max(1, Math.min(a.cap, a.count + (rnd() < .5 ? -1 : 1)));
    const n = people(a), load = Math.min(1.5, n / Math.max(1, a.cap));
    const target = a.setpoint + 1.3 * load, vent = a.mode === "BOOST" ? .12 : a.mode === "HIGH" ? .08 : a.mode === "ECO" ? .02 : .05;
    a.temp = a.temp + (target - a.temp) * .35 + (rnd() - .5) * .06;
    a.co2 = 420 + (a.co2 - 420) * Math.exp(-vent * 5) + (24 * load / vent) * (1 - Math.exp(-vent * 5));
    a.hist.push(a.temp); a.hist.shift();
    /* rules act on observed values only */
    if (n === 0 && a.mode !== "ECO" && a.mode !== "PRECOOL") { a.mode = "ECO"; a.setpoint = 25.5; a.light = a.kind === "room" ? 0 : 30;
      LOG.unshift([hhmm, "light", `${a.name} set to eco`, a.kind === "room" ? "Room empty. Lights off." : "Area empty for 15 min. Lights 30%."]); }
    else if (n > 0 && a.mode === "ECO") { a.mode = "NORMAL"; a.setpoint = 23.5; a.light = a.daylight ? 70 : 100; LOG.unshift([hhmm, "hvac", `${a.name} back to normal`, "People detected."]); }
    else if (a.temp >= 25.5 && n > 0 && a.setpoint > 22.5) { a.setpoint -= 1; LOG.unshift([hhmm, "hvac", `Cooling increased in ${a.name}`, `${f1(a.temp)} °C with ${n} people. Setpoint now ${f1(a.setpoint)} °C.`]); }
    else if (a.co2 > 1000 && a.mode !== "BOOST") { a.mode = "BOOST"; LOG.unshift([hhmm, "hvac", `${a.name} ventilation boosted`, `CO₂ ${Math.round(a.co2)} ppm.`]); }
  });
  document.getElementById("clock").textContent = `Wed 23 Sep · ${hhmm}`;
  shell(); ops(); log(); if (S.sel) select(S.sel);
}

/* ---------- controls ---------- */
document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => { S.view = b.dataset.view; document.querySelectorAll("[data-view]").forEach(x => x.setAttribute("aria-pressed", x === b)); dots(); ops(); legend(); });
document.querySelectorAll("[data-layer]").forEach(b => b.onclick = () => { S.layer = b.dataset.layer; document.querySelectorAll("[data-layer]").forEach(x => x.setAttribute("aria-pressed", x === b)); shell(); legend(); });
document.getElementById("theme").onclick = e => { const dark = document.documentElement.dataset.theme !== "dark"; document.documentElement.dataset.theme = dark ? "dark" : "light";
  e.target.textContent = dark ? "Light" : "Dark"; e.target.setAttribute("aria-label", `Switch to ${dark ? "light" : "dark"} theme`); };
let timer = null;
document.getElementById("play").onclick = e => { if (timer) { clearInterval(timer); timer = null; e.target.textContent = "Play demo"; e.target.setAttribute("aria-pressed","false"); return; }
  e.target.textContent = "Pause demo"; e.target.setAttribute("aria-pressed","true"); timer = setInterval(step, 1800); };
shell(); ops(); legend(); log();
</script>
