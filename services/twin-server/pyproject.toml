[project]
name = "twin-server"
version = "0.1.0"
description = "API, simulation engine, event processor and pipeline trigger in one process"
requires-python = ">=3.12,<3.13"
dependencies = [
    "workplace-domain",
    "alembic>=1.15",
    "fastapi>=0.115",
    "pydantic-settings>=2.8",
    "sqlalchemy>=2.0",
    "structlog>=25.1",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
twin-server = "twin_server.__main__:main"

[tool.uv.sources]
workplace-domain = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "twin_server"
module-root = ""
